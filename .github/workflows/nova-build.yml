name: Nova Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04 # We will update this to your GHCR image later

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Build Essentials (Inside Container)
      run: |
        apt-get update && apt-get install -y build-essential git autoconf automake libtool pkg-config nasm ccache python3 python3-dev openjdk-17-jdk zip unzip libx11-dev libxt-dev libfontconfig1-dev libglib2.0-dev libxml2-dev libxslt1-dev libcups2-dev libcurl4-openssl-dev libgraphite2-dev libicu-dev liblcms2-dev libnss3-dev libpng-dev libpoppler-cpp-dev libboost-dev curl ca-certificates

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: /root/.ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure
      run: |
        ./autogen.sh \
          --with-distro=LibreOfficeFull \
          --enable-ccache \
          --without-java \
          --disable-postgresql-sdbc \
          --disable-firebird-sdbc

    - name: Build
      run: |
        make -j$(nproc)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nova-build
        path: instdir/
